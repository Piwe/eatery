<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny chow — CSS art</title>

<!--
  Second entry for the DEV Frontend Challenge: Comfort Food Edition,
  under the CSS Art prompt. Lifted out of the Ouma, Nonna & Teta menu.

  To put this on CodePen: the <style> block below goes in the CSS pane,
  everything between <body> and </body> goes in the HTML pane, and the
  <script> goes in the JS pane. Nothing else is needed — no libraries,
  no images, no icon fonts.

  Bunny chow: a quarter loaf of white bread, hollowed out and filled with
  mutton curry, the torn-out crumb propped back on top. Durban, 1940s.
  Invented for people who needed a lunch they could carry.
-->

<style>
/* ============================================================
   One dish. Six elements. Every one of them positioned, coloured
   and clipped by a custom property, and every measurement inside
   in `em` — so the whole illustration scales from `font-size`.
   ============================================================ */

* { box-sizing: border-box; }

/* CodePen's preview pane sizes html to the content, so the backdrop
   goes on html as well or it stops halfway down the frame. */
html {
  min-height: 100%;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, #2c2118, #150f0a);
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  gap: 1.5rem;
  align-content: center;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, #2c2118, #150f0a);
  color: #d9c7ac;
  font: 1rem/1.5 ui-sans-serif, system-ui, sans-serif;
  text-align: center;
}

.plinth {
  position: relative;
  display: grid;
  place-items: center;
  padding: 3rem;
}
/* The table it is standing on. */
.plinth::after {
  content: "";
  position: absolute;
  inset-block-end: 2.2rem;
  inline-size: 22rem;
  block-size: 3rem;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, #00000099, transparent 70%);
  filter: blur(6px);
}

h1 { font-size: 1.4rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
p  { margin: 0; max-inline-size: 32ch; color: #a4907a; font-size: .9rem; }

/* ---- the dish system ---- */
.dish {
  --d-size: clamp(11rem, 44vw, 20rem);

  --d-vessel: #d9a765;
  --d-vessel-2: #efd0a1;
  --d-vessel-shape: inset(24% 20% 14% 20% round .09em .09em .04em .04em);
  --d-vessel-bg:
      radial-gradient(ellipse 62% 46% at 46% 36%, var(--d-vessel-2), transparent 72%),
      linear-gradient(158deg, var(--d-vessel), color-mix(in oklab, var(--d-vessel) 72%, #000));

  --d-base: #5a3a1c;
  --d-base-2: #3a2410;
  --d-base-shape: inset(26% 27% 46% 27% round .05em);
  --d-base-bg: radial-gradient(circle at 40% 34%, var(--d-base), var(--d-base-2) 74%);

  --d-sauce: #bd5522;
  --d-sauce-2: #8c3411;
  --d-sauce-shape: ellipse(21% 11% at 50% 34%);
  --d-sauce-bg: radial-gradient(circle at 44% 38%, var(--d-sauce), var(--d-sauce-2) 78%);

  --d-accent: #c69256;
  --d-accent-shape: inset(10% 34% 72% 36% round .04em);
  --d-accent-bg: linear-gradient(160deg, var(--d-accent), color-mix(in oklab, var(--d-accent) 74%, #000));
  --d-accent-tf: rotate(-9deg);

  --d-accent2: #f0d5a8;
  --d-accent2-shape: inset(23% 22% 71% 22% round .06em .06em 0 0);
  --d-accent2-bg: linear-gradient(160deg, var(--d-accent2), color-mix(in oklab, var(--d-accent2) 74%, #000));

  --d-speck: #7c2f0d;
  --d-speck-size: .026em;
  --d-specks:
      -.06em -.13em 0 var(--d-speck), .05em -.16em 0 var(--d-speck),
      .11em -.11em 0 var(--d-speck), -.13em -.1em 0 var(--d-speck),
      .01em -.09em 0 #e8a33c;

  --d-steam: #ffe9c9;

  font-size: var(--d-size);
  position: relative;
  display: block;
  inline-size: 1em;
  block-size: 1em;
  filter: drop-shadow(0 .03em .05em rgb(0 0 0 / .55));
}

.dish > * { position: absolute; inset: 0; display: block; }

.dish__vessel  { z-index: 1; background: var(--d-vessel-bg);  clip-path: var(--d-vessel-shape); }
.dish__base    { z-index: 2; background: var(--d-base-bg);    clip-path: var(--d-base-shape); }
.dish__sauce   { z-index: 3; background: var(--d-sauce-bg);   clip-path: var(--d-sauce-shape); }
.dish__accent  { z-index: 4; background: var(--d-accent-bg);  clip-path: var(--d-accent-shape);  transform: var(--d-accent-tf); }
.dish__accent2 { z-index: 5; background: var(--d-accent2-bg); clip-path: var(--d-accent2-shape); }

/* Oil and chilli on the surface: one dot, multiplied by box-shadow. */
.dish__garnish {
  z-index: 6;
  inset: auto;
  inset-block-start: 50%;
  inset-inline-start: 50%;
  inline-size: var(--d-speck-size);
  block-size: var(--d-speck-size);
  border-radius: 50%;
  background: var(--d-speck);
  box-shadow: var(--d-specks);
}

/* ---- steam (CSS) ---- */
.dish__steam { z-index: 7; pointer-events: none; }
.dish__steam i {
  position: absolute;
  inset-block-end: 62%;
  inset-inline-start: 50%;
  inline-size: .07em;
  block-size: .3em;
  border-radius: 50%;
  background: linear-gradient(to top, transparent, var(--d-steam) 55%, transparent);
  opacity: 0;
  filter: blur(.015em);
}
.dish__steam i:nth-child(2) { inset-inline-start: 42%; }
.dish__steam i:nth-child(3) { inset-inline-start: 58%; }

@media (prefers-reduced-motion: no-preference) {
  .dish__steam i { animation: steam 3.4s cubic-bezier(.2,.7,.3,1) infinite; }
  .dish__steam i:nth-child(2) { animation-delay: 1.1s; }
  .dish__steam i:nth-child(3) { animation-delay: 2.2s; }
}
@keyframes steam {
  0%   { opacity: 0;   transform: translate(-50%, 0) scaleX(.6); }
  22%  { opacity: .6; }
  100% { opacity: 0;   transform: translate(-50%, -.55em) scaleX(1.7); }
}

/* ---- the JS layer draws here ---- */
.spice {
  position: absolute;
  inset: 0;
  inline-size: 100%;
  block-size: 100%;
  pointer-events: none;
}

@media (forced-colors: active) { .dish, .spice { display: none; } }
</style>
</head>
<body>

<div class="plinth">
  <canvas class="spice" aria-hidden="true"></canvas>
  <span class="dish" role="img" aria-label="A quarter loaf of bread hollowed out and filled with mutton curry, steam rising off it.">
    <span class="dish__steam"><i></i><i></i><i></i></span>
    <span class="dish__vessel"></span>
    <span class="dish__base"></span>
    <span class="dish__sauce"></span>
    <span class="dish__accent"></span>
    <span class="dish__accent2"></span>
    <span class="dish__garnish"></span>
  </span>
</div>

<h1>Bunny chow</h1>
<p>Durban, 1940s. A quarter loaf, hollowed out, filled with mutton curry, and the bread you
   dug out put back on top. Lunch you can carry.</p>

<script>
/* The only JavaScript: warm spice dust drifting up off the curry.
   It refuses to run if the viewer asked for reduced motion. */
(() => {
  const canvas = document.querySelector('.spice');
  const plinth = canvas.closest('.plinth');
  const motionOK = matchMedia('(prefers-reduced-motion: no-preference)');
  if (!motionOK.matches) return;

  const ctx = canvas.getContext('2d');
  const dust = [];
  let w = 0, h = 0;

  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    ({ width: w, height: h } = plinth.getBoundingClientRect());
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };

  const rand = (a, b) => a + Math.random() * (b - a);

  const emit = () => dust.push({
    x: rand(w * 0.38, w * 0.62),
    y: h * rand(0.44, 0.52),
    vx: rand(-0.012, 0.012),
    vy: rand(-0.03, -0.06),
    life: rand(1400, 2800),
    age: 0,
    r: rand(0.8, 2.2),
    hue: Math.random() < 0.4 ? '232 163 60' : '189 85 34',
  });

  let last = performance.now();
  const frame = (now) => {
    const dt = Math.min(now - last, 48);
    last = now;
    if (dust.length < 40 && Math.random() < 0.35) emit();

    ctx.clearRect(0, 0, w, h);
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 0.00002 * dt;
      if (p.age >= p.life) { dust.splice(i, 1); continue; }
      ctx.globalAlpha = Math.sin(Math.PI * (p.age / p.life)) * 0.7;
      ctx.fillStyle = `rgb(${p.hue})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  };

  new ResizeObserver(size).observe(plinth);
  size();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
